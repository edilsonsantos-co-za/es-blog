<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [QSA,L]
        </IfModule>
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Theme assets and user uploads are static files only: never execute or serve scripts from them.
    <LocationMatch "^/(?:assets|uploads)/.*\.(?:php\d?|phtml|phar)$">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/(?:\.env|composer\.(?:json|lock)|symfony\.lock)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
