# Local development
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edfolio-v2-php
    volumes:
      - .:/var/www/html
    ports:
      - "8081:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-8f07e8904c675e1a885a7f20225ab8cc}
      # Containers resolve DB via milkyway network hostname
      DATABASE_URL: "mysql://edfolio_blog_user:Edf0l!0Bl0g_2025@core-database-config-mysql:3306/edfolio_blog?serverVersion=8.0&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "null://null"
    networks:
      - milkyway
    restart: unless-stopped

networks:
  milkyway:
    external: true
