# Local development
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edfolio-v2-php
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - milkyway
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: edfolio-v2-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - milkyway
    restart: unless-stopped

networks:
  milkyway:
    external: true
