# Local development
# Nginx Proxy Manager should reach this container on edfolio-v2-php:80 via
# the external milkyway network. No host ports are published from this stack.
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edfolio-v2-php
    volumes:
      - .:/var/www/html
    environment:
      # dev: template and config edits apply on reload (prod caches them until cache:clear)
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-8f07e8904c675e1a885a7f20225ab8cc}
      # From .env next to this file (never committed), e.g.
      # DATABASE_URL="mysql://edfolio_blog_user:<password>@core-database-config-mysql:3306/edfolio_blog?serverVersion=8.0&charset=utf8mb4"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env; see .env.example}
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "null://null"
      # The store container on milkyway; store.edilsonsantos.local only resolves on the host.
      THEME_STORE_URL: http://es-marketplace-store
    networks:
      - milkyway
    restart: unless-stopped

  worker:
    image: edfolio-blog-v2-php
    container_name: edfolio-v2-worker
    user: www-data
    volumes:
      - .:/var/www/html
    environment:
      # dev: template and config edits apply on reload (prod caches them until cache:clear)
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-8f07e8904c675e1a885a7f20225ab8cc}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env; see .env.example}
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "null://null"
    depends_on:
      - php
    # Runs queued jobs (LinkedIn shares, scheduled publishing) and, every five minutes,
    # the scheduler tick that starts the feed automation when it is due.
    entrypoint: ["sh", "-c"]
    command:
      - |
        until php bin/console doctrine:migrations:up-to-date --no-interaction >/dev/null 2>&1; do sleep 5; done
        while true; do
          php bin/console app:scheduler:tick --no-interaction || true
          php bin/console messenger:consume async --time-limit=300 --memory-limit=256M --no-interaction || sleep 10
        done
    healthcheck:
      disable: true
    networks:
      - milkyway
    restart: unless-stopped

networks:
  milkyway:
    external: true
