security:
    password_hashers:
        legacy_sha512:
            id: App\Security\LegacyPasswordHasher
        # Legacy SHA-512 hashes from v1 are re-hashed on next login via PasswordUpgrader
        App\Entity\User:
            algorithm: bcrypt
            cost: 13
            migrate_from:
                - legacy_sha512

    providers:
        app_users:
            id: App\Security\UsernameOrEmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_users

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                default_target_path: app_admin_dashboard
                enable_csrf: true

            two_factor:
                auth_form_path: app_2fa
                check_path: app_2fa_check
                default_target_path: app_admin_dashboard
                auth_code_parameter_name: _auth_code
                trusted_parameter_name: _trusted
                enable_csrf: true

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    role_hierarchy:
        ROLE_ADMIN:  [ROLE_EDITOR, ROLE_AUTHOR]
        ROLE_EDITOR: [ROLE_AUTHOR]

    access_control:
        - { path: ^/login,   roles: PUBLIC_ACCESS }
        - { path: ^/2fa,     roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin,   roles: ROLE_AUTHOR }
        - { path: ^/api,     roles: ROLE_AUTHOR }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: bcrypt
                cost: 4
