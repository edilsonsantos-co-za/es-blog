framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            failed:
                dsn: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\SendWelcomeEmailMessage: async
            App\Message\PublishScheduledPostsMessage: async
            App\Message\GenerateThumbnailMessage: async
            App\Message\SyncLinkedInPostMessage: async
            App\Message\PurgeExpiredCacheMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
