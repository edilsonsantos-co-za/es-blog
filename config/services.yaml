# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(ANTHROPIC_API_KEY): ''
    env(AUTOMATION_AI_MODEL): 'claude-opus-5-5'
    # Optional: AI banner illustrations (OpenAI Images). Empty uses generative art.
    env(OPENAI_API_KEY): ''
    env(BANNER_IMAGE_MODEL): 'gpt-image-1'
    env(LINKEDIN_CLIENT_ID): ''
    env(LINKEDIN_CLIENT_SECRET): ''
    env(LINKEDIN_REDIRECT_URI): ''
    env(LINKEDIN_API_VERSION): '202608'
    env(X_CLIENT_ID): ''
    env(X_CLIENT_SECRET): ''
    env(X_REDIRECT_URI): ''
    env(ES_DEVELOPERS_URL): 'https://developers.edilsonsantos.co.za/'
    env(UPWORK_URL): ''
    env(SUPPORT_URL): ''
    # Buy Me a Coffee header button and footer link; blank hides both.
    env(COFFEE_URL): 'https://buymeacoffee.com/edilsonsantos'
    # Where Admin -> Themes reads the catalogue and downloads packages from.
    env(THEME_STORE_URL): 'https://store.edilsonsantos.co.za'
    # Allow theme packages that are not signed by a key in config/theme-keys/.
    env(THEMES_ALLOW_UNSIGNED): '0'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $anthropicApiKey: '%env(ANTHROPIC_API_KEY)%'
            string $automationModel: '%env(AUTOMATION_AI_MODEL)%'
            string $openAiApiKey: '%env(OPENAI_API_KEY)%'
            string $bannerImageModel: '%env(BANNER_IMAGE_MODEL)%'
            string $linkedInClientId: '%env(LINKEDIN_CLIENT_ID)%'
            string $linkedInClientSecret: '%env(LINKEDIN_CLIENT_SECRET)%'
            string $linkedInRedirectUri: '%env(LINKEDIN_REDIRECT_URI)%'
            string $linkedInApiVersion: '%env(LINKEDIN_API_VERSION)%'
            string $xClientId: '%env(X_CLIENT_ID)%'
            string $xClientSecret: '%env(X_CLIENT_SECRET)%'
            string $xRedirectUri: '%env(X_REDIRECT_URI)%'
            string $developersUrl: '%env(ES_DEVELOPERS_URL)%'
            string $upworkUrl: '%env(UPWORK_URL)%'
            string $supportUrl: '%env(SUPPORT_URL)%'
            string $coffeeUrl: '%env(COFFEE_URL)%'
            string $appSecret: '%kernel.secret%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'

    # MediaService needs the project root dir as a scalar argument
    App\Service\MediaService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AppVersion:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Twig BlogExtension — tagged automatically via autoconfigure (GlobalsInterface)
    App\Twig\BlogExtension:
        tags: ['twig.extension']

    # Session storage on the app's own database connection (see framework.session)
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - !service { class: PDO, factory: ['@doctrine.dbal.default_connection', 'getNativeConnection'] }
            - { lock_mode: 0 }
