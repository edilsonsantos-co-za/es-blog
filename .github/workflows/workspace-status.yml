# workspace-managed-sha256: b5dd65136ee4b386eb557ab9b8da27cdcb61fa105d4d1960a8d86c538dbd0354
name: Workspace status

on:
    workflow_run:
        workflows: ["Deploy", "Release", "Workspace deploy", "Workspace formatting repair"]
        types: [completed]

permissions:
    contents: read

jobs:
    notify:
        if: github.event.workflow_run.name != 'Workspace status'
        runs-on: ubuntu-latest
        steps:
            - name: Notify configured Google Workspace channels
              env:
                  WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL != '' && secrets.GOOGLE_CHAT_WEBHOOK_URL || secrets.GOOGLE_CHAT_WEBHOOK }}
                  WEBHOOK_URLS: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URLS }}
                  LEGACY_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
                  RUN_NAME: ${{ github.event.workflow_run.name }}
                  RUN_STATUS: ${{ github.event.workflow_run.conclusion }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
                  RUN_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  python3 - <<'PY'
                  import json, os, urllib.request, urllib.parse
                  urls = json.loads(os.environ.get("WEBHOOK_URLS") or "[]")
                  if not isinstance(urls, list):
                      raise ValueError("GOOGLE_CHAT_WEBHOOK_URLS must be a JSON array")
                  if os.environ.get("WEBHOOK_URL"):
                      urls.append(os.environ["WEBHOOK_URL"])
                  if os.environ.get("LEGACY_WEBHOOK_URL") and os.environ.get("LEGACY_WEBHOOK_URL") != os.environ.get("WEBHOOK_URL"):
                      urls.append(os.environ["LEGACY_WEBHOOK_URL"])
                  urls = list(dict.fromkeys(urls))
                  if not urls:
                      print("::warning::No Google Chat channel configured: set GOOGLE_CHAT_WEBHOOK_URL(S)")
                      raise SystemExit(0)
                  repo, name = os.environ["GITHUB_REPOSITORY"], os.environ["RUN_NAME"]
                  status = (os.environ.get("RUN_STATUS") or "unknown").lower()
                  branch, sha, run_url = os.environ["RUN_BRANCH"], os.environ["RUN_SHA"], os.environ["RUN_URL"]
                  text = f"{repo}: {name} {status.upper()}\n{branch} @ {sha[:12]}\n{run_url}"
                  icon = {"success": "✅", "failure": "❌", "cancelled": "⏹️", "skipped": "⏭️"}.get(status, "⚠️")
                  esc = lambda v: str(v).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                  card = {"cardsV2": [{"cardId": "run", "card": {
                      "header": {"title": f"{icon} {name}: {status}"[:200], "subtitle": repo[:200]},
                      "sections": [{"widgets": [
                          {"decoratedText": {"topLabel": "Branch", "text": esc(branch)}},
                          {"decoratedText": {"topLabel": "Commit", "text": esc(sha[:12])}},
                          {"buttonList": {"buttons": [
                              {"text": "Open run", "onClick": {"openLink": {"url": run_url}}},
                              {"text": "Commit", "onClick": {"openLink": {"url": f"https://github.com/{repo}/commit/{sha}"}}},
                          ]}},
                      ]}]}}]}
                  failed = 0
                  for url in urls:
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.scheme != "https" or parsed.hostname != "chat.googleapis.com":
                          raise ValueError("Only Google Chat HTTPS webhooks are allowed")
                      # Card first; if Chat rejects it, the same facts as plain text.
                      for payload in (card, {"text": text}):
                          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                              headers={"Content-Type": "application/json; charset=UTF-8"}, method="POST")
                          try:
                              with urllib.request.urlopen(req, timeout=20) as response:
                                  response.read()
                              break
                          except Exception:
                              continue
                      else:
                          failed += 1
                  if failed:
                      raise SystemExit(f"Failed to notify {failed} channel(s); webhook values are not logged")
                  print(f"Notified {len(urls)} channel(s)")
                  PY
