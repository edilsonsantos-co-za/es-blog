# Production — blog.edilsonsantos.co.za
# Usage:
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nginx Proxy Manager should reach this container on es-blog:80 via
# the external milkyway network. No host ports are published from this stack.

name: es-blog

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: es-blog:prod
    container_name: es-blog
    env_file: .env
    volumes:
      - uploads:/var/www/html/public/uploads
      - themes:/var/www/html/var/themes
    networks:
      milkyway:
        # Nginx Proxy Manager still forwards blog.edilsonsantos.co.za to the old container name; drop this
        # alias once the proxy host points at es-blog:80.
        aliases:
          - edfolio-v2-php
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "bin/console", "about", "--env=prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: es-blog:prod
    container_name: es-blog-worker
    user: www-data
    env_file: .env
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      - php
    # Runs queued jobs (LinkedIn shares, scheduled publishing) and, every five minutes,
    # the scheduler tick that starts the feed automation when it is due.
    entrypoint: ["sh", "-c"]
    command:
      - |
        until php bin/console doctrine:migrations:up-to-date --no-interaction >/dev/null 2>&1; do sleep 5; done
        while true; do
          php bin/console app:scheduler:tick --no-interaction || true
          php bin/console messenger:consume async --time-limit=300 --memory-limit=256M --no-interaction || sleep 10
        done
    healthcheck:
      disable: true
    networks:
      - milkyway
    restart: unless-stopped

# The data volumes keep the names the first deploys created (compose project "edfolio-blog-v2"), so
# renaming the project and containers never starts from empty volumes.
volumes:
  # Post images and generated banners; survives rebuilds and redeploys.
  uploads:
    name: edfolio-blog-v2_uploads
  # Themes installed from Admin -> Themes; survives rebuilds and redeploys.
  themes:
    name: edfolio-blog-v2_themes

networks:
  milkyway:
    external: true
