# Production — blog.edilsonsantos.co.za
# Usage:
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edfolio-v2-php
    env_file: .env
    networks:
      - milkyway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "bin/console", "about", "--env=prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: edfolio-v2-nginx
    expose:
      - "80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - milkyway
    restart: unless-stopped

networks:
  milkyway:
    external: true
